<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그래프 마을 대모험</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#1d2433;background:#9fd8ff;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.btn{border:0;border-radius:16px;padding:12px 18px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:#ffcc33;color:#3a2a00;box-shadow:0 5px 0 #d89b00}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d89b00}
.btn.blue{background:#4f8cff;color:#fff;box-shadow:0 5px 0 #2a5fcc}
.btn.big{font-size:22px;padding:15px 30px}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(20,25,50,.6);border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:999px;font-size:15px;color:#fff;font-family:inherit;font-weight:800}
button.pill{cursor:pointer}
#talk{position:fixed;right:18px;bottom:22px;z-index:10;border:0;border-radius:24px;padding:16px 22px;font:inherit;font-size:20px;font-weight:900;background:linear-gradient(#ff8ac6,#ff5fa2);color:#fff;box-shadow:0 6px 0 #c2307a,0 10px 30px rgba(0,0,0,.3);cursor:pointer;animation:bob 1s ease-in-out infinite}
#talk small{display:block;font-size:13px;opacity:.9}
#joy{position:fixed;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);z-index:10;display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.3)}
#help{position:fixed;left:12px;bottom:12px;z-index:9;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
/* visual novel */
#vn{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(to top,rgba(30,10,60,.6),rgba(30,10,60,.12) 55%,rgba(0,0,0,0))}
#stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:56px 10px 6px}
#panel{width:min(760px,96vw);background:rgba(255,255,255,.96);border-radius:20px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:zoom .3s cubic-bezier(.2,1.3,.4,1)}
.pt1{text-align:center;font-weight:900;font-size:clamp(16px,2.4vw,20px);margin-bottom:6px}
.pt2{font-weight:900;font-size:15px;margin-bottom:4px;display:flex;align-items:center}
.gc{width:100%;height:clamp(200px,38vh,320px);display:block;touch-action:none;border-radius:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo .gc{height:clamp(170px,30vh,250px)}
@media(max-width:620px){.duo{grid-template-columns:1fr}.duo .gc{height:170px}}
.tag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1e88e5;color:#fff;font-weight:900;margin-right:6px;flex:none}
.tb{border-collapse:collapse;margin:8px auto 0;font-size:15px;background:#fff}
.tb th,.tb td{border:1px solid #9cc3e6;padding:6px 8px;text-align:center}.tb th{background:#cfe5f8}
.tb td.hl{background:#fff1a8;font-weight:900;color:#c2410c;outline:3px solid #ffb300}
.sb{background:#0f3b26;border:6px solid #3a2a1a;border-radius:12px;padding:10px;color:#fff;text-align:center}
.sbt{font-weight:900;margin-bottom:6px;color:#ffe680}
.sb table{margin:0 auto;border-collapse:collapse}.sb td,.sb th{border:1px solid #2f6b4d;padding:6px 9px;font-family:monospace;font-size:18px}
.sb td.on{color:#ffd400;text-shadow:0 0 8px #ffb000;font-weight:900;animation:pop .4s}
.defbox{margin-top:8px;background:#eef7e0;border-radius:14px;padding:12px;font-size:17px;line-height:1.6}
.kw{color:#e11d48;font-weight:900;border:2px solid #e11d48;border-radius:8px;padding:0 6px;background:#fff}
.bigicon{font-size:64px;text-align:center;padding:8px}
.stmt{background:#fff7d6;border:2px dashed #f0b400;border-radius:12px;padding:8px 12px;margin-top:6px;font-weight:700}
#qp{width:min(760px,96vw);margin-top:8px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;font-weight:800;font-size:clamp(15px,2.2vw,18px);line-height:1.45}
#qp:empty{display:none}
#qp b{color:#e0457b}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(760px,96vw);margin-top:8px}
#choices:empty{display:none}
@media(max-width:620px){#choices{grid-template-columns:1fr}}
.vc{border:3px solid #c4a8ff;border-radius:16px;padding:12px 10px;font:inherit;font-size:clamp(15px,2.2vw,18px);font-weight:800;background:linear-gradient(#fff,#f3edff);color:#3b2470;cursor:pointer;box-shadow:0 4px 0 #a78bfa;transition:transform .1s}
.vc:hover{transform:translateY(-2px)}
.vc.ok{background:#22c55e;border-color:#15803d;color:#fff;animation:pop .4s}
.vc.no{background:#fca5a5;border-color:#ef4444;color:#7f1d1d;opacity:.6;animation:shake .4s;pointer-events:none}
#dlg{position:relative;width:min(900px,97vw);margin:76px auto 12px}
#por{position:absolute;left:12px;bottom:calc(100% - 14px);width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd6ec 60%,#f7a8d0);border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;font-size:64px;z-index:2;animation:zoom .3s}
#face{position:absolute;right:-8px;top:-8px;font-size:30px;background:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#nm{position:absolute;left:128px;top:-18px;z-index:2;background:linear-gradient(#a78bfa,#7c3aed);color:#fff;padding:5px 16px;border-radius:12px;font-weight:900;font-size:17px;box-shadow:0 3px 0 #5b21b6}
#nm small{font-size:13px;margin-left:6px}
#box{background:linear-gradient(#fffefe,#f7f0ff);border:3px solid #b794ff;border-radius:22px;padding:24px 22px 18px;min-height:112px;font-size:clamp(16px,2.4vw,20px);line-height:1.6;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#box b{color:#d6336c}
#nx{position:absolute;right:20px;bottom:10px;color:#8b5cf6;animation:bob .7s infinite}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,10,30,.62);display:none;place-items:center;padding:16px}
#modal.on{display:grid}
.mbox{max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:22px;text-align:center;background:#fff;border-radius:22px;animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
.mbox h2{margin:6px 0}.mbox p{margin:8px 0;font-size:17px;line-height:1.5}.mbox .btn{margin:8px 4px 0}
.gift{font-size:120px;cursor:pointer;display:inline-block;filter:drop-shadow(0 0 22px var(--gc,#fff));transition:filter .3s;margin:8px 0}
.gift.sh{animation:wob .35s}
.reveal{font-size:116px;animation:spin .8s cubic-bezier(.2,1.4,.4,1)}
.rar{font-weight:900;font-size:24px;letter-spacing:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.ci{border-radius:12px;padding:8px 2px;text-align:center;background:#f3f5f9;border:3px solid #ddd;position:relative}
.ci .e{font-size:36px}.ci .n{font-size:11px;font-weight:800}.ci.no .e{filter:brightness(0);opacity:.2}
.ql{text-align:left;margin-top:10px}.ql div{padding:9px 10px;border-radius:12px;margin:6px 0;background:#f4f1ff;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.ql div.d{background:#dcfce7}
.cert{border:8px double #d4a017;border-radius:16px;padding:18px;background:linear-gradient(#fffdf2,#fff3c4)}
#title{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,0),rgba(20,10,50,.45))}
.tcard{text-align:center;color:#fff}
.logo{font-weight:900;font-size:clamp(40px,9vw,84px);line-height:1.05;text-shadow:0 2px 0 #c03a7a,0 4px 0 #a02a66,0 6px 0 #7a1d4f,0 10px 20px rgba(0,0,0,.45)}
.logo span{color:#ffe14d}
.sub{font-size:19px;font-weight:800;margin:14px 0 18px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#nameI{font:inherit;font-size:20px;font-weight:800;padding:12px 16px;border-radius:14px;border:3px solid #fff;width:min(280px,80vw);text-align:center;margin-bottom:14px;outline:none}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(15,20,40,.92);color:#fff;padding:11px 18px;border-radius:14px;font-weight:800;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.pt{position:fixed;left:50%;top:45%;font-size:28px;pointer-events:none;z-index:80;animation:pt 1s ease-out forwards}
.fl{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#ffd700;text-shadow:0 3px 0 #a16207,0 0 12px #000;pointer-events:none;z-index:80;animation:flt 1.1s ease-out forwards;white-space:nowrap}
.ballfx{position:fixed;font-size:46px;z-index:60;pointer-events:none;animation:throw .75s ease-in forwards}
.hitfx{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(50px,10vw,90px);font-weight:900;color:#fff;-webkit-text-stroke:3px #e11d48;z-index:60;pointer-events:none;animation:hitp .9s ease-out forwards}
#fade{position:fixed;inset:0;background:#fff;z-index:90;pointer-events:none;opacity:0}
#fade.go{animation:fade .6s}
#err{position:fixed;inset:0;display:none;place-items:center;z-index:99;background:#203;color:#fff;font-size:20px;text-align:center;padding:20px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes zoom{from{transform:scale(.7);opacity:0}}
@keyframes wob{25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
@keyframes spin{from{transform:rotateY(720deg) scale(.2)}}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.5) rotate(var(--r));opacity:0}}
@keyframes flt{to{transform:translate(-50%,-70px);opacity:0}}
@keyframes throw{from{left:88%;top:34%;transform:scale(.6) rotate(0)}45%{top:24%}to{left:8%;top:42%;transform:scale(1.7) rotate(720deg)}}
@keyframes hitp{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes fade{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><span class="pill">🪙 <b id="coinN">0</b></span><button class="pill" id="qB">📜 퀘스트 <b id="doneN">0</b>/9</button><button class="pill" id="colB">📖 도감 <b id="itemN">0</b>/30</button><button class="pill" id="muteB">🔊</button></div>
<div id="help" class="hidden">이동: WASD·방향키 / 땅을 클릭 · 말 걸기: 스페이스 · 휠: 줌</div>
<button id="talk" class="hidden">💬 말 걸기<small id="talkN"></small></button>
<div id="joy"><div id="knob"></div></div>
<div id="vn" class="hidden">
 <div id="stage"><div id="panel" class="hidden"></div><div id="qp"></div><div id="choices"></div></div>
 <div id="dlg"><div id="por"><span id="porE"></span><div id="face"></div></div><div id="nm"></div><div id="box"><div id="tx"></div><div id="nx">▼</div></div></div>
</div>
<div id="title"><div class="tcard"><div class="logo">그래프 마을<br><span>대모험</span></div><div class="sub">지우개 폭풍에 사라진 꺾은선그래프를 되찾아라!</div><input id="nameI" maxlength="8" placeholder="내 이름을 입력해요"><br><button class="btn big" id="startB">🚀 모험 시작!</button></div></div>
<div id="modal"></div><div id="toast"></div><div id="fade"></div>
<div id="err">3D 엔진을 불러오지 못했어요 😢<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const fmt=v=>{v=Math.round(v*100)/100;return v>=1000?v.toLocaleString('ko-KR'):String(v)};
const T1={hw:'높은',lw:'낮은',uw:'오른',dw:'내려간'};
const CTX=[
{t:'시각별 오늘의 기온',x:'시각',y:'기온',u:'℃',xs:'time',step:1,shape:'hill',lo:8,hi:27,col:'b',...T1},
{t:'시각별 교실의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:10,hi:24,col:'b',...T1},
{t:'시각별 수영장 물의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:18,hi:31,col:'b',...T1},
{t:'요일별 운동장의 온도',x:'요일',y:'온도',u:'℃',xs:'weekday',step:1,shape:'wave',lo:5,hi:22,col:'b',...T1},
{t:'월별 새끼 고양이의 무게',x:'월',y:'무게',u:'kg',xs:'month',step:.1,shape:'up',lo:.3,hi:2.4,col:'g',hw:'무거운',lw:'가벼운',uw:'늘어난',dw:'줄어든'},
{t:'주별 방울토마토 줄기의 길이',x:'주',y:'길이',u:'cm',xs:'week',step:2,shape:'up',lo:2,hi:40,col:'g',hw:'긴',lw:'짧은',uw:'자란',dw:'줄어든'},
{t:'날짜별 해바라기의 키',x:'날짜',y:'키',u:'cm',xs:'day',step:5,shape:'up',lo:10,hi:120,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'연도별 우리 학교 학생 수',x:'연도',y:'학생 수',u:'명',xs:'year',step:10,shape:'down',lo:300,hi:560,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 강아지의 키',x:'월',y:'키',u:'cm',xs:'month',step:1,shape:'up',lo:22,hi:48,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'시각별 막대 그림자의 길이',x:'시각',y:'길이',u:'cm',xs:'time',step:10,shape:'valley',lo:40,hi:220,col:'b',hw:'긴',lw:'짧은',uw:'늘어난',dw:'줄어든'},
{t:'월별 저금통에 모은 돈',x:'월',y:'금액',u:'원',xs:'month',step:500,shape:'up',lo:1000,hi:15000,col:'g',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 도서관 대출 책 수',x:'월',y:'책 수',u:'권',xs:'month',step:2,shape:'wave',lo:10,hi:58,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
];
const XU={time:'시',month:'월',week:'주',day:'일',year:'년',weekday:''};
function labelOf(c,n){switch(c.xs){
 case 'time':return n<12?{s:''+n,sub:'오전',f:`오전 ${n}시`}:n===12?{s:'12',sub:'낮',f:'낮 12시'}:{s:''+(n-12),sub:'오후',f:`오후 ${n-12}시`};
 case 'month':return{s:''+n,f:n+'월'};case 'week':return{s:''+n,f:n+'주'};case 'day':return{s:''+n,f:n+'일'};case 'year':return{s:''+n,f:n+'년'};
 default:return{s:'월화수목금'[n],f:'월화수목금'[n]+'요일'}}}
function genNums(c,n,iv){let st=0,d=iv;
 if(c.xs==='time')st=iv===1?R(9,10):9;else if(c.xs==='month')st=iv===1?R(3,6):3;else if(c.xs==='week')st=1;else if(c.xs==='day'){st=1;d=3*iv}else if(c.xs==='year')st=iv===1?R(2018,2020):2016;
 return Array.from({length:n},(_,i)=>st+i*d)}
function genSeries(c,n,shape){const loK=Math.round(c.lo/c.step),hiK=Math.round(c.hi/c.step),span=hiK-loK,mi=Math.max(1,Math.round(span/(n-1)*.9));
 for(let t=0;t<300;t++){let ks,k;
  if(shape==='up'||shape==='down'){k=R(loK,loK+Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=R(1,mi);ks.push(k)}if(shape==='down')ks.reverse()}
  else if(shape==='hill'||shape==='valley'){const p=R(1,n-2);k=R(loK,loK+Math.floor(span/3));ks=[k];for(let i=1;i<n;i++){k+=i<=p?R(1,mi):-R(1,mi);ks.push(k)}if(shape==='valley')ks=ks.map(v=>loK+hiK-v)}
  else{k=R(loK+Math.floor(span/4),hiK-Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=(Math.random()<.5?-1:1)*R(1,mi);ks.push(k)}}
  if(ks.every(v=>v>=loK&&v<=hiK))return ks}
 return Array.from({length:n},(_,i)=>loK+i)}
function makeGraph(o={}){const c=o.c||pick(CTX.filter(o.filter||(()=>true)));const iv=o.iv||1;const n=o.n||(c.xs==='weekday'?5:R(4,6));
 const nums=genNums(c,n,iv),xs=nums.map(v=>labelOf(c,v)),ks=genSeries(c,n,o.shape||c.shape);
 const maxK=Math.max(...ks),minK=Math.min(...ks);const yMaxK=(Math.floor(maxK/5)+1)*5;const yMinK=minK>=20?(Math.floor(minK/5)-1)*5:0;
 return{c,nums,xs,ks,yMinK,yMaxK,wave:yMinK>0,kind:'line',hide:-1}}
const V=(g,k)=>fmt(k*g.c.step)+g.c.u;
const ie=w=>josa(w,'이에요','예요');
function numChoices(k,g){const set=new Set([k]);for(const d of shuffle([1,-1,2,-2,5,-5,3,-3,10])){if(set.size>=4)break;if(k+d>=0)set.add(k+d)}return shuffle([...set]).map(x=>V(g,x))}
const LINE_S=['하루 동안 운동장 기온의 변화','1년 동안 내 키의 변화','월별 강아지 몸무게의 변화','주별 콩나물 키의 변화','연도별 우리 마을 인구의 변화','시각별 교실 온도의 변화','요일별 줄넘기 기록의 변화'];

function moveP(dx,dz){let nx=player.position.x+dx,nz=player.position.z+dz;for(const c of colliders){const ex=nx-c.x,ez=nz-c.z,d=Math.hypot(ex,ez),m=c.r+.55;if(d<m&&d>1e-4){nx=c.x+ex/d*m;nz=c.z+ez/d*m}}
 player.position.x=Math.max(-62,Math.min(62,nx));player.position.z=Math.max(-62,Math.min(62,nz))}
const nextCh=()=>CH.find(c=>!S.done[c.id]);
const clock=new THREE.Clock();let frame=0,camPos=new THREE.Vector3(0,30,40),camLook=new THREE.Vector3();
function tick(){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;if(document.hidden)return;frame++;
 let ix=0,iz=0,walking=false;
 if(started&&!vn.on&&!modalOn()){if(keys.KeyW||keys.ArrowUp)iz-=1;if(keys.KeyS||keys.ArrowDown)iz+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;ix+=joy.x;iz+=joy.y;
  if(ix||iz)tapT=null;else if(tapT){const dx=tapT.x-player.position.x,dz=tapT.z-player.position.z,d=Math.hypot(dx,dz);if(d<.4)tapT=null;else{ix=dx/d;iz=dz/d}}
  const l=Math.hypot(ix,iz);if(l>.1){const s=Math.min(1,l);ix=ix/l*s;iz=iz/l*s;const sp=(keys.ShiftLeft?14:9)*dt;const bx=player.position.x,bz=player.position.z;moveP(ix*sp,iz*sp);if(tapT&&Math.hypot(player.position.x-bx,player.position.z-bz)<sp*.2)tapT=null;pRot=Math.atan2(ix,iz);walking=true}}
 let dr=((pRot-player.rotation.y+Math.PI)%TAU+TAU)%TAU-Math.PI;player.rotation.y+=dr*Math.min(1,dt*12);
 const ud=player.userData;if(walking){const w=Math.sin(t*12);ud.aL.rotation.x=w*.7;ud.aR.rotation.x=-w*.7;player.children[0].rotation.x=-w*.5;player.children[1].rotation.x=w*.5;player.position.y=Math.abs(w)*.12}else{ud.aL.rotation.x*=.8;ud.aR.rotation.x*=.8;player.children[0].rotation.x*=.8;player.children[1].rotation.x*=.8;player.position.y*=.8}
 anims.forEach(f=>f(t,dt));
 // npcs
 near=null;let nd=3.8;npcs.forEach((n,i)=>{const dx=player.position.x-n.g.position.x,dz=player.position.z-n.g.position.z,d=Math.hypot(dx,dz);
  n.mk.material.map=n.owl?TEX_O:(S.done[n.def.id]?TEX_D:TEX_Q);n.mk.position.y=(n.owl?4.9:3.6)+Math.sin(t*3+i)*.15;
  if(d<8&&!n.owl){let a=Math.atan2(dx,dz),r=((a-n.g.rotation.y+Math.PI)%TAU+TAU)%TAU-Math.PI;n.g.rotation.y+=r*Math.min(1,dt*5)}
  if(d<nd){nd=d;near=n}});
 if(near&&started&&!vn.on&&!modalOn()){$('#talk').classList.remove('hidden');$('#talkN').textContent=near.def.name}else $('#talk').classList.add('hidden');
 // chests
 if(started&&!vn.on&&!modalOn())for(let i=chests.length-1;i>=0;i--){const c=chests[i];if(Math.hypot(player.position.x-c.position.x,player.position.z-c.position.z)<1.9){scene.remove(c);chests.splice(i,1);openChest();if(!chests.length)setTimeout(()=>{spawnChests();toast('✨ 새 보물상자들이 마을 곳곳에 나타났어요!')},1500);break}}
 // arrow
 const tg=!S.pro?null:nextCh()?npcs.find(n=>n.ch===nextCh()):(!S.ending?owlN:null);
 if(tg&&started&&!vn.on){const dx=tg.g.position.x-player.position.x,dz=tg.g.position.z-player.position.z,d=Math.hypot(dx,dz);arrow.visible=d>6;arrow.position.set(player.position.x+dx/d*2.2,.35+Math.sin(t*5)*.1,player.position.z+dz/d*2.2);arrow.rotation.y=Math.atan2(dx,dz)}else arrow.visible=false;
 // camera
 if(!started){const a=t*.08;camPos.set(Math.sin(a)*48,26,Math.cos(a)*48);camLook.set(0,2,0);camera.position.copy(camPos)}
 else{let tx=player.position.x,tz=player.position.z,ox=0,oy=13*camD,oz=15*camD;if(vn.on&&vn.npc&&vn.npc.g){tx=(tx+vn.npc.g.position.x)/2;tz=(tz+vn.npc.g.position.z)/2;ox=4.5;oy=5.5;oz=9.5}
  camPos.set(tx+ox,oy,tz+oz);camera.position.lerp(camPos,Math.min(1,dt*4));camLook.lerp(new THREE.Vector3(tx,vn.on?2.6:1.2,tz),Math.min(1,dt*5))}
 camera.lookAt(camLook);
 if(vn.on&&frame%2)return;renderer.render(scene,camera)}
requestAnimationFrame(tick);
function openChest(){sfx.coin();if(Math.random()<.3){toast('✨ 반짝반짝 보물상자! 안에서 럭키 박스가 나왔어요!');openBox(()=>{})}else{const c=R(2,8)*5,crit=Math.random()<.12;const g=crit?c*3:c;S.coins+=g;save();counts();floatTxt(`+${g}🪙${crit?' 💥대박!':''}`);burst('🪙✨',crit?16:8);toast(crit?'💰 황금 보물상자! 코인 3배!':'보물상자에서 코인 발견! 🪙')}}
// ================= talking =================
function talkTo(n){if(vn.on)return;sfx.tap(3);tapT=null;
 if(n.owl)return vnStart(OWL,owlSteps(),null);
 const c=n.ch,nd={id:c.id,name:c.name,e:c.e,g:n.g};
 if(!S.done[c.id])return vnStart(nd,c.script(),()=>{if(vn.fin)chapterDone(c)});
 vnStart(nd,[{t:c.after,f:'😊',opts:[{t:'🔁 문제 다시 풀어 볼래요!',go:()=>c.script()},{t:'안녕히 계세요! 👋',r:'또 놀러 와~!',f:'👋'}]}],()=>{if(vn.fin){S.coins+=30;save();counts();toast('복습 완료! 🪙 +30')}})}
function chapterDone(c){const first=!S.done[c.id];S.done[c.id]=1;S.coins+=100;save();counts();burst('🎉⭐✨🏅',24);sfx.rar(2);
 modal(`<div style="font-size:70px">🏅</div><h2>${c.place} 퀘스트 완료!</h2><p><b>${c.name}</b>의 그래프를 되찾았어요!<br>우정 ${hearts(c.id)}</p><p>🪙 +100 · 진행 ${CH.filter(x=>S.done[x.id]).length}/9</p><button class="btn big" id="cbB">🎁 보상 상자 열기</button>`);
 $('#cbB').onclick=()=>openBox(()=>{const nx=nextCh();toast(nx?`📍 다음 목적지: <b>${nx.place}</b>의 ${nx.name} (노란 화살표를 따라가요!)`:'🦉 광장의 부엉 박사에게 돌아가 보세요!')},true)}
function quizSteps(n){vn.stat={n:0,first:0};const st=[];const types=ALL.filter(t=>t!=='plot');
 for(let i=0;i<n;i++){const q=GEN[pick(types)]();const p=q.g?{g:q.g,g2:q.g2,mid:q.mid,hideTitle:q.hideTitle}:{html:'<div class="bigicon">📈 🆚 📊</div>'};
  const qp=`(${i+1}/${n}) ${q.p}${q.stmt?`<div class="stmt">“${q.stmt}”</div>`:''}`;st.push({p,t:`${i+1}번 문제! 부엉~ 그래프를 잘 보게!`,f:'🧐',q:{p:qp,ch:q.ch,a:q.a,e:q.e}})}
 st.push({p:null,t:()=>`부엉! ${n}문제 중 <b>${vn.stat.first}문제</b>를 한 번에 맞혔구먼! ${vn.stat.first>=n*.8?'대단하네! 🏆':vn.stat.first>=n*.5?'잘했어! 👍':'조금 더 연습해 보세!💪'}`,f:'🦉'});return st}
function owlSteps(){
 if(!S.pro)return[
  {w:'nar',t:'여기는 숫자와 그래프가 살아 숨 쉬는 「그래프 마을」.'},
  {t:'부엉! 어서 오게, {name}! 기다리고 있었다네.',f:'😊'},
  {t:'어젯밤 무시무시한 「지우개 폭풍」이 불어서 마을 사람들의 그래프가 몽땅 지워져 버렸지 뭔가!',f:'😱'},
  {t:'그래프가 없으니 기상 예보도, 야구 해설도, 빵집 장사도 엉망진창이라네…',f:'😭'},
  {t:'자네가 마을을 돌아다니며 사람들을 도와 <b>꺾은선그래프</b>를 되찾아 주게!',f:'🙏'},
  {t:'머리 위에 <b>❗</b> 표시가 있는 사람에게 다가가 말을 걸면 된다네. 발밑의 <b>노란 화살표</b>가 길을 알려 줄 걸세.',f:'☝️'},
  {t:'컴퓨터는 <b>WASD·방향키</b>로 걷고, 태블릿은 <b>왼쪽 아래 조이스틱</b>이나 <b>땅을 톡</b> 누르면 된다네. 가까이 가면 💬 버튼이 나타나지.',f:'🎮'},
  {t:'길에 떨어진 반짝이는 <b>보물상자</b>도 열어 보게. 뭐가 나올지는 나도 모른다네, 부엉~',f:'😉'},
  {t:'자, 준비됐는가?',f:'🦉',opts:[{t:'맡겨 주세요! 💪',r:'부엉부엉! 든든하구먼! 먼저 <b>기상대</b>의 하늘 캐스터에게 가 보게!',f:'😆'},{t:'떨리지만… 해 볼게요!',r:'걱정 말게, 틀려도 다시 고를 수 있다네. 먼저 <b>기상대</b>의 하늘 캐스터에게 가 보게!',f:'😊'}]},
  {run:()=>{S.pro=1;save()},t:'행운을 비네! 부엉~ 🌟',f:'🦉'}];
 if(!nextCh()&&!S.ending)return[
  {t:'부엉부엉!! {name}!! 해냈구먼!!',f:'😭'},{fx:'confetti',t:'마을 사람들의 꺾은선그래프가 모두 돌아왔다네! 지우개 폭풍도 물러갔어!',f:'🥳'},
  {w:'nar',t:'마을 사람들이 광장으로 모여들어 {name}에게 박수를 보냈다. 👏👏👏'},
  {t:'자네는 이제 진정한 「꺾은선그래프 마스터」일세. 이 인증서를 받게!',f:'🦉',run:()=>{S.ending=1;save();setTimeout(cert,100)}}];
 const nx=nextCh(),o=[{t:'🎲 랜덤 그래프 퀴즈 10문제!',go:()=>quizSteps(10)},{t:'📜 이제 어디로 가요?',go:()=>[{t:nx?`<b>${nx.place}</b>의 ${nx.name}에게 가 보게! 노란 화살표를 따라가면 된다네.`:'모든 퀘스트를 끝냈구먼! 이제 랜덤 퀴즈로 실력을 더 키워 보게!',f:'🧐'}]},
  {t:'🎁 럭키 박스 사기 (80🪙)',go:()=>{if(S.coins<80)return[{t:`코인이 부족하구먼 (지금 ${S.coins}🪙). 문제를 풀거나 보물상자를 찾아보게!`,f:'😅'}];S.coins-=80;save();counts();return[{t:'자, 받게! 부엉~',f:'🎁',run:()=>setTimeout(()=>openBox(()=>{}),50)}]}}];
 if(S.ending)o.push({t:'🏅 인증서 다시 보기',go:()=>[{t:'자네의 자랑스러운 인증서라네!',f:'😊',run:()=>setTimeout(cert,50)}]});
 o.push({t:'그냥 인사하러 왔어요~',r:'부엉~ 마을 구경도 하고 보물상자도 찾아보게!',f:'😊'});
 return[{t:'부엉! 무엇을 도와줄까?',f:'🦉',opts:o}]}
function cert(){const d=new Date();modal(`<div class="cert"><div style="font-size:54px">🏅</div><h2>꺾은선그래프 마스터 인증서</h2><p style="font-size:22px"><b>${S.name}</b></p><p>위 탐험대원은 그래프 마을 9곳의 꺾은선그래프를 모두 되찾아<br>마을을 지우개 폭풍으로부터 구했기에<br>이 인증서를 드립니다.</p><p style="color:#8a6d00">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 · 그래프 마을 촌장 부엉 박사 🦉</p></div><button class="btn big" id="ceB">고마워요!</button>`);$('#ceB').onclick=closeModal}
// ================= HUD buttons / start =================
$('#qB').onclick=()=>{modal(`<h2>📜 퀘스트</h2><div class="ql">${CH.map((c,i)=>`<div class="${S.done[c.id]?'d':''}"><span>${S.done[c.id]?'✅':'⬜'} ${i+1}. ${c.place} · ${c.name}</span><span>${hearts(c.id)}</span></div>`).join('')}</div><p style="font-size:14px;color:#667">💗 우정은 한 번에 정답을 맞히거나 좋은 선택을 하면 올라가요</p><button class="btn" id="mc">닫기</button>`);$('#mc').onclick=closeModal};
$('#colB').onclick=()=>{modal(`<h2>📖 그래프 친구 도감</h2><p style="font-size:14px">보물상자·퀘스트 보상에서 나와요 <b style="color:#9aa5b1">일반</b> <b style="color:#3b82f6">희귀</b> <b style="color:#a855f7">영웅</b> <b style="color:#f59e0b">전설</b></p><div class="cgrid">${ITEMS.map((it,i)=>{const c=S.items[i]||0;return`<div class="ci ${c?'':'no'}" style="border-color:${c?RAR[it[2]].c:'#ddd'}"><div class="e">${it[0]}</div><div class="n">${c?it[1]+(c>1?' ×'+c:''):'???'}</div></div>`}).join('')}</div><button class="btn" id="mc">닫기</button>`);$('#mc').onclick=closeModal};
$('#muteB').onclick=()=>{S.mute=S.mute?0:1;save();$('#muteB').textContent=S.mute?'🔇':'🔊'};$('#muteB').textContent=S.mute?'🔇':'🔊';
if(S.name&&S.name!=='탐험대원')$('#nameI').value=S.name;
$('#startB').onclick=()=>{const v=$('#nameI').value.trim();S.name=v||'탐험대원';save();$('#title').classList.add('hidden');$('#hud').classList.remove('hidden');if(!matchMedia('(pointer:coarse)').matches)$('#help').classList.remove('hidden');
 started=true;camera.position.set(0,13,28);counts();sfx.rar(1);if(!S.pro)setTimeout(()=>vnStart(OWL,owlSteps(),null),500);else toast(`다시 온 걸 환영해요, ${S.name}! 🎉`)};
counts();
</script>
